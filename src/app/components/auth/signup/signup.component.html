<div class="signup-container retro-border-box">
  <h2>Sign Up</h2>

  <form (ngSubmit)="onSignup()" [formGroup]="signupForm" class="signup-form">
    <div class="form-field">
      <label for="username">Player Name:</label>
      <input type="username" id="username" formControlName="username" class="retro-input" required>
      <div *ngIf="signupForm.get('username')?.invalid && (signupForm.get('username')?.dirty || signupForm.get('username')?.touched)" class="error-message">
        <small *ngIf="signupForm.get('username')?.errors?.['username']">Player Name is required.</small>
      </div>
    </div>
    
    <div class="form-field">
      <label for="email">Email:</label>
      <input type="email" id="email" formControlName="email" class="retro-input" required>
      <div *ngIf="signupForm.get('email')?.invalid && (signupForm.get('email')?.dirty || signupForm.get('email')?.touched)" class="error-message">
        <small *ngIf="signupForm.get('email')?.errors?.['required']">Email is required.</small>
        <small *ngIf="signupForm.get('email')?.errors?.['email']">Invalid email format.</small>
      </div>
    </div>

    <div class="form-field">
      <label for="password">Password:</label>
      <input type="password" id="password" formControlName="password" class="retro-input" required>
      <div *ngIf="signupForm.get('password')?.invalid && (signupForm.get('password')?.dirty || signupForm.get('password')?.touched)" class="error-message">
        <small *ngIf="signupForm.get('password')?.errors?.['required']">Password is required.</small>
        <small *ngIf="signupForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</small>
      </div>
    </div>

    <div class="form-field">
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" formControlName="confirmPassword" class="retro-input" required>
      <div *ngIf="signupForm.get('confirmPassword')?.invalid && (signupForm.get('confirmPassword')?.dirty || signupForm.get('confirmPassword')?.touched) && signupForm.get('confirmPassword')?.errors?.['required']" class="error-message">
        <small>Confirming password is required.</small>
      </div>
      <div *ngIf="signupForm.errors?.['passwordsMustMatch'] && (signupForm.get('confirmPassword')?.dirty || signupForm.get('confirmPassword')?.touched)" class="error-message">
        <small>Passwords do not match.</small>
      </div>
    </div>

    <button type="submit" [disabled]="signupForm.invalid" class="retro-button primary-button">Sign Up</button>
  </form>

  <div class="login-link">
    <p>Already have an account? <a (click)="navigateToLogin()" class="retro-link">Login</a></p>
  </div>
</div>
