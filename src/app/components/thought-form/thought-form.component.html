<form [formGroup]="form" (ngSubmit)="submitThought()" class="form">
    <input type="text" formControlName="title" placeholder="Title" />
    <textarea formControlName="content" placeholder="What's on your mind?"></textarea>
    <div class="form-actions">
      <button type="button" (click)="onCancel()" *ngIf="isEditMode()" class="cancel-btn">Cancel</button>
      <button type="submit" [disabled]="form.invalid" class="save-btn">{{ isEditMode() ? 'Update Thought' : 'Add Thought' }}</button>
    </div>
</form>
