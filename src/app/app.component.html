<header class="app-header">
  <h1>Julio's Retro Journal</h1>
  <nav class="app-nav">
    <!-- If user is authenticated -->
    <ng-container *ngIf="this.authService.currentUserSignal()">
      <span class="user-email" *ngIf="this.authService.currentUserSignal() as user">{{ user.username }}</span>
      <a (click)="logout()" class="nav-link logout-button">Logout</a>
    </ng-container>
    <!-- If user is NOT authenticated -->
    <ng-container *ngIf="!this.authService.currentUserSignal()">
      <a routerLink="/login" class="nav-link">Login</a>
      <a routerLink="/signup" class="nav-link">Sign Up</a>
    </ng-container>
  </nav>
</header>

<main class="container">
  <router-outlet></router-outlet>
</main>
